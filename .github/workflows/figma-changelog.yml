name: Figma Changelog Generator
on:
  # Triggered by Figma webhook via GitHub repository_dispatch
  repository_dispatch:
    types: [figma-library-publish]
  # Also allows manual trigger from GitHub UI for testing
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. v1.3)'
        required: false
        default: ''
      ticket:
        description: 'Jira ticket (e.g. CXI-2010)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install node-fetch
      - name: Run Figma diff script
        id: changelog
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_ID: ${{ secrets.FIGMA_FILE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
          MANUAL_TICKET: ${{ github.event.inputs.ticket }}
          # From webhook payload (set automatically when Figma triggers)
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          TICKET_FROM_WEBHOOK: ${{ github.event.client_payload.ticket }}
        run: node .github/scripts/generate-changelog.js
      - name: Commit updated changelog
        run: |
          git config --global user.name "IW Changelog Bot"
          git config --global user.email "changelog-bot@interwetten.com"
          git add changelog-data.json styles-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit and deploy"
            exit 0
          fi
          git commit -m "chore: auto-update changelog via Figma publish"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      - name: Create Jira ticket
        if: steps.changelog.outputs.has_changes == 'true'
        env:
          ATLASSIAN_DOMAIN: ${{ secrets.ATLASSIAN_DOMAIN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
        run: node .github/scripts/create-jira-ticket.js
